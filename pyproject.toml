[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "layout-aware-retrieval"
version = "0.1.2"
description = "Layout-aware retrieval over engineering datasheets: page-native layout regions as a verifiable retrieval unit"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Zikang Zhou" }]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "PyMuPDF>=1.24,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=3,<6"]
fastembed = ["fastembed>=0.4,<1"]
pipeline = [
  "doclayout-yolo>=0.0.3",
  "huggingface-hub>=0.27,<2",
  "sentence-transformers>=3,<6",
]
mcp = ["mcp>=1,<2", "pydantic>=2,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.urls]
Homepage = "https://github.com/zzkws/Layout-Aware-Retrieval"
Repository = "https://github.com/zzkws/Layout-Aware-Retrieval"
Documentation = "https://github.com/zzkws/Layout-Aware-Retrieval/tree/main/docs"
Demo = "https://evidence-rag-txc.zzkws.chatgpt.site"
Issues = "https://github.com/zzkws/Layout-Aware-Retrieval/issues"

[tool.setuptools]
py-modules = ["config", "evidence_service"]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "pipeline*", "tools*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data", "data_tkd", "models", "sites"]

[tool.ruff.lint]
select = ["E", "F", "I"]
