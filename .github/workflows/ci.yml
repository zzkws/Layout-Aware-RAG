name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -m tools.scan_public
      - run: python -m tools.verify_public_snapshot --corpus txc --data-dir sites/txc-demo/public/data
      - run: python -m tools.verify_public_snapshot --corpus tkd --data-dir sites/tkd-demo/public/data

  sites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [txc-demo, tkd-demo]
    defaults:
      run:
        working-directory: sites/${{ matrix.site }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/${{ matrix.site }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
